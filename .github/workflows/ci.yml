# This workflow installs dependencies with Bun, builds the source code and runs
# tests across the supported Node.js versions. Bun is the package manager and
# task runner; the Node.js matrix still exercises the published library on every
# runtime we claim to support.

name: CI

on:
  push:
    branches: [master, develop]
    paths:
      - src/**
      - bun.lock
      - package.json
      - tsconfig.json
      - biome.json
      - .github/workflows/ci.yml
  pull_request:
    paths:
      - src/**
      - bun.lock
      - package.json
      - tsconfig.json
      - biome.json
      - .github/workflows/ci.yml

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock', '**/package.json') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # tsdown needs Promise.withResolvers (Node 22+), so the build step runs on
      # the Bun runtime. The tests below still run on the Node.js matrix, which
      # is what actually exercises the supported runtimes.
      - run: bun run --bun build
      - run: bun run test

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock', '**/package.json') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Type check
        run: bun run typecheck

  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # The express app in *.test.ts is a mock server that echoes request
          # bodies back on purpose; scanning it only yields false positives
          # such as js/reflected-xss.
          config: |
            paths-ignore:
              - src/**/*.test.ts
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
